name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ResourceManager.slnx
      - name: Build
        run: dotnet build ResourceManager.slnx -c Release --no-restore
      - name: Test
        run: dotnet test ResourceManager.Tests/ResourceManager.Tests.csproj -c Release --no-build
      - name: Publish Windows x64 client
        run: dotnet publish ResourceManager.App/ResourceManager.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:ResourceManagerGitHubClientId=${{ vars.RESOURCE_MANAGER_GITHUB_CLIENT_ID }} -o dist/win-x64
      - name: Publish Windows x64 server
        run: dotnet publish ResourceManager.Server/ResourceManager.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist/server-win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: ResourceManager-win-x64
          path: dist/win-x64/ResourceManager.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: ResourceManager-Server-win-x64
          path: dist/server-win-x64
          if-no-files-found: error
          retention-days: 14
